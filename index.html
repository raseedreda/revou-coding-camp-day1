<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bekantan Clicker</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Bounce animation — umpan balik klik pada bekantan */
    @keyframes bekantan-bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.15) translateY(-8px); }
      60%  { transform: scale(0.95) translateY(4px); }
      80%  { transform: scale(1.05) translateY(-2px); }
      100% { transform: scale(1) translateY(0); }
    }

    /* Scale animation — efek scale saat klik */
    @keyframes bekantan-scale {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* Fade animation — untuk elemen +1 yang muncul dan menghilang */
    @keyframes plus-one-fade {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      60%  { opacity: 0.8; transform: translateY(-30px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
    }

    /* Milestone pulse animation — efek khusus pada area score saat kelipatan 10 */
    @keyframes milestone-pulse {
      0%   { transform: scale(1); color: inherit; }
      20%  { transform: scale(1.25); color: #f59e0b; }
      40%  { transform: scale(1.1); color: #ef4444; }
      60%  { transform: scale(1.2); color: #f59e0b; }
      80%  { transform: scale(1.05); color: #10b981; }
      100% { transform: scale(1); color: inherit; }
    }

    /* Utility classes untuk animasi */
    .animate-bekantan-bounce {
      animation: bekantan-bounce 0.4s ease-out;
    }

    .animate-bekantan-scale {
      animation: bekantan-scale 0.25s ease-out;
    }

    .plus-one {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      font-weight: 700;
      color: #f59e0b;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      animation: plus-one-fade 0.8s ease-out forwards;
      z-index: 9999;
      user-select: none;
    }

    .animate-milestone-pulse {
      animation: milestone-pulse 0.6s ease-in-out;
    }

    /* Cat reaction fade-in */
    @keyframes cat-reaction-fade {
      0%   { opacity: 0; transform: translateY(6px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-cat-reaction {
      animation: cat-reaction-fade 0.3s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-amber-50 to-orange-100 flex flex-col items-center justify-center p-4 select-none">

  <!-- Score Display -->
  <div class="mb-6 text-center">
    <div id="score-value" class="text-6xl font-extrabold text-amber-700 leading-none">0</div>
    <div id="score-label" class="text-lg font-medium text-amber-600 mt-1">Klik</div>
  </div>

  <!-- Bekantan Click Target -->
  <div class="mb-6">
    <img
      id="bekantan"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Proboscis_Monkey_in_Borneo.jpg/320px-Proboscis_Monkey_in_Borneo.jpg"
      alt="Bekantan"
      class="w-48 h-48 object-cover rounded-full shadow-xl cursor-pointer border-4 border-amber-300 hover:border-amber-500 transition-colors"
      onerror="this.outerHTML='<div id=&quot;bekantan&quot; class=&quot;w-48 h-48 flex items-center justify-center text-8xl cursor-pointer rounded-full shadow-xl border-4 border-amber-300 hover:border-amber-500 bg-amber-100 transition-colors select-none&quot;>🐒</div>'"
    />
  </div>

  <!-- Cat Container -->
  <div id="cat-container" class="mb-6 flex flex-col items-center">
    <div class="text-5xl mb-2">🐱</div>
    <div
      id="cat-reaction"
      class="text-base font-medium text-gray-700 bg-white rounded-2xl px-4 py-2 shadow-md min-w-[160px] text-center"
    >
      Klik bekantannya!
    </div>
  </div>

  <!-- Reset Button -->
  <button
    id="reset-btn"
    class="mt-2 px-6 py-2 bg-red-400 hover:bg-red-500 active:bg-red-600 text-white font-semibold rounded-full shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-red-300"
    type="button"
  >
    Reset
  </button>

  <!-- Inline JS will be added in later tasks -->
</body>
</html>
